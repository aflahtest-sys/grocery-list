<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5A3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Groceries">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Grocery List</title>
<style>
  :root {
    --bg: #F3F7F4;
    --surface: #FFFFFF;
    --ink: #18241D;
    --muted: #5E6E64;
    --line: #DCE5DF;
    --basil: #1F5A3D;
    --basil-soft: #E2EFE6;
    --saffron: #E8A33D;
    --on-basil: #FFFFFF;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1A14;
      --surface: #17241D;
      --ink: #E8F0EA;
      --muted: #9AACA0;
      --line: #2A3A31;
      --basil: #6CC08F;
      --basil-soft: #1E3328;
      --saffron: #F0B85A;
      --on-basil: #0F1A14;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Sinhala", "Noto Sans Tamil", "Noto Sans Arabic", sans-serif;
    font-size: 17px;
    line-height: 1.4;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    min-height: 100vh;
  }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 120px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0; font-weight: 750; letter-spacing: -0.01em; }
  .share-btn {
    flex: none; border: 1.5px solid var(--basil); color: var(--basil); background: transparent;
    font: inherit; font-size: 0.95rem; font-weight: 600; border-radius: 999px; padding: 8px 16px; cursor: pointer;
  }

  .sync { margin: -8px 2px 12px; font-size: 0.85rem; color: var(--muted); }
  .sync::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--basil); margin-inline-end: 6px; vertical-align: middle; }
  .sync.off::before { background: var(--saffron); }

  /* One language button opens a searchable list of every language. */
  .lang-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 14px;
    font: inherit; color: var(--ink); background: var(--basil-soft); border: none;
    border-radius: 16px; padding: 12px 16px; cursor: pointer; text-align: start;
  }
  .lang-btn .globe { font-size: 1.25rem; line-height: 1; }
  .lang-btn #langName { flex: 1; font-weight: 700; font-size: 1.05rem; }
  .lang-btn .chev { color: var(--muted); font-size: 0.9rem; }

  .picker {
    position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.45);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .picker[hidden] { display: none; }
  .sheet {
    width: 100%; max-width: 560px; height: min(86vh, 720px); background: var(--surface); color: var(--ink);
    border-radius: 22px 22px 0 0; display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet-top { display: flex; align-items: center; gap: 8px; padding: 16px 16px 10px; }
  .sheet-top h2 { flex: 1; margin: 0; font-size: 1.2rem; }
  .sheet-top button { font: inherit; font-size: 1.3rem; line-height: 1; background: none; border: none; color: var(--muted); padding: 6px 10px; cursor: pointer; }
  .sheet input {
    margin: 0 16px 8px; font: inherit; color: var(--ink); background: var(--bg);
    border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none;
  }
  .sheet input:focus { border-color: var(--basil); }
  .lang-list { overflow-y: auto; padding: 0 8px 16px; -webkit-overflow-scrolling: touch; }
  .lang-head { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; padding: 14px 10px 6px; }
  .lang-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%;
    font: inherit; color: var(--ink); background: none; border: none; border-radius: 12px;
    padding: 12px 10px; cursor: pointer; text-align: start;
  }
  .lang-row .native { font-weight: 600; }
  .lang-row .en-name { color: var(--muted); font-size: 0.9rem; }
  .lang-row[aria-pressed="true"] { background: var(--basil-soft); }
  .lang-row[aria-pressed="true"] .native::after { content: " ✓"; color: var(--basil); }
  .lang-none { text-align: center; color: var(--muted); padding: 24px; }

  .add {
    display: flex; gap: 8px; background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 16px; padding: 6px; margin-bottom: 8px;
  }
  .add:focus-within { border-color: var(--basil); }
  .add input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: transparent;
    border: none; outline: none; padding: 10px 10px; unicode-bidi: plaintext;
  }
  .add button {
    flex: none; font: inherit; font-weight: 700; border: none; border-radius: 12px;
    background: var(--basil); color: var(--on-basil); padding: 10px 18px; cursor: pointer;
  }
  .tip { font-size: 0.85rem; color: var(--muted); margin: 0 4px 18px; }

  .bar { display: flex; justify-content: space-between; align-items: center; margin: 0 4px 6px; color: var(--muted); font-size: 0.9rem; }
  .link-btn { font: inherit; font-size: 0.9rem; background: none; border: none; color: var(--basil); font-weight: 600; cursor: pointer; padding: 6px 0; }

  ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 16px; border: 1px solid var(--line); overflow: hidden; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 10px 12px 14px; border-top: 1px solid var(--line); }
  li:first-child { border-top: none; }
  .check {
    flex: none; width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line);
    background: transparent; display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .check svg { width: 18px; height: 18px; opacity: 0; }
  li.done .check { background: var(--saffron); border-color: var(--saffron); }
  li.done .check svg { opacity: 1; }
  .text { flex: 1; min-width: 0; cursor: pointer; }
  .name { font-size: 1.1rem; font-weight: 600; word-break: break-word; unicode-bidi: plaintext; }
  .orig { font-size: 0.8rem; color: var(--muted); unicode-bidi: plaintext; word-break: break-word; }
  li.done .name { text-decoration: line-through; color: var(--muted); font-weight: 500; }
  .retry { font: inherit; font-size: 0.8rem; color: var(--saffron); background: none; border: none; padding: 0; cursor: pointer; text-align: start; }
  .del { flex: none; font-size: 1.2rem; line-height: 1; color: var(--muted); background: none; border: none; padding: 8px; cursor: pointer; }

  .new-list { display: block; margin: 18px auto 0; }
  .empty { text-align: center; color: var(--muted); padding: 36px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 0.95rem;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Grocery List</h1>
    <button class="share-btn" id="shareBtn">Share</button>
  </header>

  <p class="sync" id="sync" hidden></p>
  <button class="lang-btn" id="langBtn" aria-haspopup="dialog">
    <span class="globe" aria-hidden="true">🌐</span>
    <span id="langName">English</span>
    <span class="chev" aria-hidden="true">▼</span>
  </button>

  <div class="add">
    <input id="itemInput" type="text" enterkeyhint="done" autocomplete="off" autocapitalize="off">
    <button id="addBtn">Add</button>
  </div>
  <p class="tip" id="tip"></p>

  <div class="bar" id="bar">
    <span id="count"></span>
    <button class="link-btn" id="clearBtn">Remove bought</button>
  </div>
  <ul id="list"></ul>
  <div class="empty" id="empty"></div>
  <button class="link-btn new-list" id="newBtn"></button>
</main>

<div class="picker" id="picker" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
    <div class="sheet-top">
      <h2 id="pickerTitle">Language</h2>
      <button id="pickerClose" aria-label="Close">✕</button>
    </div>
    <input id="langSearch" type="search" autocomplete="off" autocapitalize="off">
    <div class="lang-list" id="langList"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

// Ignore case, extra spaces and common Arabic spelling differences (ة/ه, أ/إ/آ/ا, ى/ي, diacritics).
function norm(t) {
  return String(t || "").trim().toLowerCase()
    .replace(/[\u064B-\u0652\u0640]/g, "")
    .replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي")
    .replace(/\s+/g, " ");
}

// Alphabets used by only one language tell us the language for sure.
// Anything else (Latin, Arabic, Cyrillic letters…) is detected by the translator.
const UNIQUE_SCRIPTS = [
  [/[\u0D80-\u0DFF]/, "si"], [/[\u0B80-\u0BFF]/, "ta"], [/[\u0E00-\u0E7F]/, "th"], [/[\uAC00-\uD7AF\u1100-\u11FF]/, "ko"],
  [/[\u3040-\u30FF]/, "ja"], [/[\u0370-\u03FF]/, "el"], [/[\u10A0-\u10FF]/, "ka"], [/[\u0530-\u058F]/, "hy"],
  [/[\u1780-\u17FF]/, "km"], [/[\u0E80-\u0EFF]/, "lo"], [/[\u1000-\u109F]/, "my"], [/[\u0A80-\u0AFF]/, "gu"],
  [/[\u0A00-\u0A7F]/, "pa"], [/[\u0C80-\u0CFF]/, "kn"], [/[\u0D00-\u0D7F]/, "ml"], [/[\u0C00-\u0C7F]/, "te"],
  [/[\u0B00-\u0B7F]/, "or"], [/[\u0780-\u07BF]/, "dv"]
];
function scriptLang(t) {
  for (const [re, code] of UNIQUE_SCRIPTS) if (re.test(t)) return code;
  return null;
}

const DICT_INDEX = new Map();
DICT.forEach(row => row.forEach(word => { if (word) DICT_INDEX.set(norm(word), row); }));

  const row = DICT.find(r => r[0] === en);
  if (row) DICT_INDEX.set(norm(alias), row);
});

  .forEach(([alias, en]) => { const row = DICT.find(r => r[0] === en); if (row) DICT_INDEX.set(norm(alias), row); });

function lookup(text) {
  const row = DICT_INDEX.get(norm(text));
  if (!row) return null;
  const tr = {};
  DICT_LANGS.forEach((l, k) => { if (row[k]) tr[l] = row[k]; });
  return tr;
}

// Which language a known word is written in.
function knownLang(text) {
  const row = DICT_INDEX.get(norm(text));
  if (!row) return null;
  const n = norm(text);
  const k = row.findIndex(w => w && norm(w) === n);
  return k >= 0 ? DICT_LANGS[k] : null;
}

// MyMemory uses standard codes where Google uses older ones.
const MYMEMORY_CODE = { iw: "he", jw: "jv" };

// Google's free web translator first, MyMemory as a backup. "auto" lets Google detect the language.
async function translateOne(text, from, to) {
  try {
    const url = "https://translate.googleapis.com/translate_a/single?client=gtx&dt=t" +
      "&sl=" + encodeURIComponent(from) + "&tl=" + encodeURIComponent(to) + "&q=" + encodeURIComponent(text);
    const res = await fetchWithTimeout(url, 8000);
    if (!res.ok) throw new Error("http " + res.status);
    const data = await res.json();
    const out = (data[0] || []).map(part => part[0]).join("").trim();
    if (out) return out;
    throw new Error("empty");
  } catch (e) {
    const src = from === "auto" ? "en" : (MYMEMORY_CODE[from] || from);
    const dst = MYMEMORY_CODE[to] || to;
    if (src === dst) return text;
    const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) +
      "&langpair=" + encodeURIComponent(src + "|" + dst);
    const res = await fetchWithTimeout(url, 8000);
    if (!res.ok) throw new Error("http " + res.status);
    const data = await res.json();
    const out = data && data.responseData && String(data.responseData.translatedText || "").trim();
    if (out && data.responseStatus === 200 && !/MYMEMORY WARNING|INVALID/i.test(out)) return out;
    throw new Error("no translation");
  }
}

function fetchWithTimeout(url, ms, opts) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  return fetch(url, { ...(opts || {}), signal: ctl.signal }).finally(() => clearTimeout(timer));
}

// Each phone translates items into the language it is showing, and shares the result,
// so the list fills in for every language the people using it have chosen.
const inFlight = new Set();   // "itemId|lang"
const failedTr = new Set();

async function translateItem(id, to) {
  const item = items.find(i => i.id === id);
  const key = id + "|" + to;
  if (!item || item.tr[to] || inFlight.has(key)) return;
  inFlight.add(key);
  failedTr.delete(key);
  render();
  let out = null;
  try { out = await translateOne(item.text, item.lang || "auto", to); }
  catch (e) { failedTr.add(key); }
  inFlight.delete(key);
  if (out && items.some(i => i.id === id)) dispatch({ type: "setTr", id, tr: { [to]: out } });
  else render();
  if (!out && !navigator.onLine) toast(t("offline"));
}

function translateAllMissing() {
  items.forEach(i => {
    if (!i.tr[viewLang] && !failedTr.has(i.id + "|" + viewLang)) translateItem(i.id, viewLang);
  });
}

// ---------- Interface text for any language ----------

const uiCache = {};   // lang -> { key: text }

function loadUiCache(lang) {
  if (uiCache[lang]) return uiCache[lang];
  try {
    const saved = JSON.parse(localStorage.getItem("groceries.ui." + lang) || "null");
    if (saved && typeof saved === "object") uiCache[lang] = saved;
  } catch (e) {}
  return uiCache[lang] || null;
}

// Translate the whole interface once per language (one request), then remember it.
async function ensureUi(lang) {
  if (UI_LANGS.includes(lang) || loadUiCache(lang)) return;
  const keys = Object.keys(UI);
  // Numbers stand in for {d} and {n} so the translator keeps them in place.
  const src = keys.map(k => UI[k].en.replace("{d}", "7").replace("{n}", "9").replace(/\n/g, " "));
  try {
    const url = "https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=en&tl=" +
      encodeURIComponent(lang) + "&q=" + encodeURIComponent(src.join("\n"));
    const res = await fetchWithTimeout(url, 10000);
    if (!res.ok) return;
    const data = await res.json();
    const lines = (data[0] || []).map(p => p[0]).join("").split("\n").map(s => s.trim());
    if (lines.length !== keys.length) return;
    const out = {};
    keys.forEach((k, i) => {
      let s = lines[i];
      if (!s) return;
      if (k === "count") {
        s = s.replace(/[7٧۷७৭੭૭୭௭౭೭൭๗໗၇]/, "{d}").replace(/[9٩۹९৯੯૯୯௯౯೯൯๙໙၉]/, "{n}");
        if (!s.includes("{d}") || !s.includes("{n}")) return;   // keep English rather than a wrong count
      }
      out[k] = s;
    });
    uiCache[lang] = out;
    try { localStorage.setItem("groceries.ui." + lang, JSON.stringify(out)); } catch (e) {}
    if (viewLang === lang) render();
  } catch (e) { /* offline: English interface until next time */ }
}

function t(key, vars) {
  let s = (UI[key] && UI[key][viewLang]) || (loadUiCache(viewLang) || {})[key] || (UI[key] && UI[key].en) || key;
  if (vars) for (const k in vars) s = s.replace("{" + k + "}", vars[k]);
  return s;
}

// ---------- State ----------
// The list shown = the last copy saved on the server + changes not yet sent.
// Without a shared list (before the first Share), everything stays on this phone.

const CODE_RE = /^[a-z]{2,3}(-[A-Za-z]{2,4})?$/;
let base = [];           // last saved copy of the list
let pending = [];        // changes not yet confirmed by the server
let items = [];          // what is shown: base with pending changes applied
let listId = null;       // short id of the shared list, e.g. "k3x9q2"
let serverV = 0;
let online = true;
let viewLang = "en";

function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// Same rules as the server (api/list.js), so the phone and server always agree.
function applyOp(list, op) {
  switch (op.type) {
    case "add":
      return list.some(i => i.id === op.item.id) ? list : [op.item, ...list];
    case "toggle":
      return list.map(i => (i.id === op.id ? { ...i, done: !!op.done } : i));
    case "remove":
      return list.filter(i => i.id !== op.id);
    case "clearDone":
      return list.filter(i => !i.done);
    case "setTr":
      return list.map(i => {
        if (i.id !== op.id) return i;
        const tr = { ...i.tr };
        Object.keys(op.tr || {}).forEach(l => { if (CODE_RE.test(l) && op.tr[l] && !tr[l]) tr[l] = op.tr[l]; });
        return { ...i, tr };
      });
    default:
      return list;
  }
}

function recompute() {
  items = pending.reduce(applyOp, base.map(i => ({ ...i, tr: { ...(i.tr || {}) } })));
}

function dispatch(op) {
  if (listId) {
    pending.push(op);
    recompute();
    saveLocal();
    render();
    flush();
  } else {
    base = applyOp(base, op);
    recompute();
    saveLocal();
    render();
  }
}

function loadLocal() {
  try {
    const st = JSON.parse(localStorage.getItem("groceries.state") || "null");
    if (st && typeof st === "object") {
      listId = st.listId || null;
      base = Array.isArray(st.base) ? st.base : [];
      pending = Array.isArray(st.pending) ? st.pending : [];
      serverV = st.v || 0;
    } else {
      // Lists saved by the earlier version of the app.
      const old = JSON.parse(localStorage.getItem("groceries.items") || "[]");
      base = Array.isArray(old) ? old.filter(i => i && i.text).map(({ state, ...i }) => ({ ...i, tr: i.tr || {} })) : [];
    }
  } catch (e) { base = []; pending = []; }
  try {
    const l = localStorage.getItem("groceries.lang");
    viewLang = LANG_BY_CODE.has(l) ? l : guessPhoneLang();
  } catch (e) { viewLang = guessPhoneLang(); }
  recompute();
}

function saveLocal() {
  try {
    localStorage.setItem("groceries.state", JSON.stringify({ listId, base, pending, v: serverV }));
  } catch (e) { /* storage blocked: the list still works while the app is open */ }
}

// Open in the phone's own language when we support it.
function guessPhoneLang() {
  const alias = { he: "iw", jv: "jw", fil: "tl", nb: "no", nn: "no", zh: "zh-CN" };
  for (const raw of (navigator.languages || [navigator.language || "en"])) {
    const full = String(raw);
    if (/^zh-(TW|HK|MO|Hant)/i.test(full)) return "zh-TW";
    const base = full.split("-")[0].toLowerCase();
    const code = alias[base] || base;
    if (LANG_BY_CODE.has(code)) return code;
  }
  return "en";
}


// ---------- Talking to the server ----------

async function api(method, id, body) {
  const url = "/api/list" + (id ? "?id=" + encodeURIComponent(id) : "");
  const res = await fetchWithTimeout2(url, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined
  }, 10000);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error((data && data.error) || "http " + res.status); err.status = res.status; throw err; }
  return data;
}

function fetchWithTimeout2(url, opts, ms) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  return fetch(url, { ...opts, signal: ctl.signal }).finally(() => clearTimeout(timer));
}

function setOnline(v) {
  if (online !== v) { online = v; renderSync(); }
}

function acceptServer(data) {
  base = Array.isArray(data.items) ? data.items : [];
  serverV = data.v || 0;
  recompute();
  saveLocal();
  render();
  translateAllMissing();
}

let flushing = false;
async function flush() {
  if (!listId || flushing || !pending.length) return;
  flushing = true;
  try {
    while (pending.length) {
      const batch = pending.slice(0, 50);
      const data = await api("POST", listId, { ops: batch });
      pending = pending.slice(batch.length);
      acceptServer(data);
      setOnline(true);
    }
  } catch (e) {
    if (e.status === 404) listGone();
    else setOnline(false);
  } finally {
    flushing = false;
  }
}

async function refresh() {
  if (!listId || document.hidden) return;
  if (pending.length) { flush(); return; }
  try {
    const data = await api("GET", listId);
    setOnline(true);
    if (!pending.length && !flushing && data.v !== serverV) acceptServer(data);
  } catch (e) {
    if (e.status === 404) listGone();
    else setOnline(false);
  }
}

function listGone() {
  // The shared list was deleted or expired: keep the items on this phone as a private list.
  toast(t("notFound"));
  base = items;
  pending = [];
  listId = null;
  serverV = 0;
  history.replaceState(null, "", "/");
  saveLocal();
  render();
}

function openListFromPath() {
  const m = location.pathname.match(/^\/l\/([a-z0-9]{4,16})\/?$/i);
  if (m) {
    const id = m[1].toLowerCase();
    if (id !== listId) {
      listId = id;
      base = [];
      pending = [];
      serverV = 0;
      recompute();
      saveLocal();
    }
  } else if (listId) {
    // Opened from the home screen: go back to the shared list used last time.
    history.replaceState(null, "", "/l/" + listId);
  }
}

// ---------- Actions ----------

function addFromInput() {
  const input = document.getElementById("itemInput");
  // Split on commas (English and Arabic), semicolons and new lines.
  const parts = input.value.split(/[,،;؛\n]+/).map(s => s.trim()).filter(Boolean);
  if (!parts.length) { input.focus(); return; }
  input.value = "";
  const added = [];
  for (const text of parts) {
    const known = lookup(text);
    // The language is certain for words in the built-in list and for alphabets used by one language only.
    // Otherwise "auto": the translator works out which language it is.
    const lang = knownLang(text) || scriptLang(text) || "auto";
    const tr = known ? known : (lang !== "auto" ? { [lang]: text } : {});
    const item = { id: newId(), text, lang, done: false, tr };
    added.push(item);
    dispatch({ type: "add", item });
  }
  input.focus();
  added.forEach(i => translateItem(i.id, viewLang));
}

function toggle(id) {
  const item = items.find(i => i.id === id);
  if (item) dispatch({ type: "toggle", id, done: !item.done });
}

function startNewList() {
  if (!confirm(t("newListQ"))) return;
  listId = null;
  base = [];
  pending = [];
  serverV = 0;
  recompute();
  history.replaceState(null, "", "/");
  saveLocal();
  render();
}

function removeItem(id) { dispatch({ type: "remove", id }); }
function removeBought() { dispatch({ type: "clearDone" }); }

function setLang(l) {
  if (!LANG_BY_CODE.has(l)) return;
  const previous = viewLang;
  viewLang = l;
  recent = [l, previous, ...recent].filter((x, i, arr) => arr.indexOf(x) === i).slice(0, 5);
  try {
    localStorage.setItem("groceries.lang", l);
    localStorage.setItem("groceries.recentLangs", JSON.stringify(recent));
  } catch (e) {}
  render();
  ensureUi(l);
  translateAllMissing();
}

let recent = [];
try { recent = JSON.parse(localStorage.getItem("groceries.recentLangs") || "[]").filter(c => LANG_BY_CODE.has(c)); } catch (e) {}

// ---------- Language picker ----------

function openPicker() {
  const sheet = document.getElementById("picker");
  sheet.hidden = false;
  document.body.style.overflow = "hidden";
  const q = document.getElementById("langSearch");
  q.value = "";
  renderPicker();
  setTimeout(() => q.focus(), 50);
}

function closePicker() {
  document.getElementById("picker").hidden = true;
  document.body.style.overflow = "";
  document.getElementById("langBtn").focus();
}

function langRow(code) {
  const L = LANG_BY_CODE.get(code);
  const b = document.createElement("button");
  b.className = "lang-row";
  b.setAttribute("aria-pressed", String(code === viewLang));
  const n = document.createElement("span");
  n.className = "native";
  n.textContent = L.native;
  n.dir = "auto";
  b.appendChild(n);
  if (L.native !== L.en) {
    const e = document.createElement("span");
    e.className = "en-name";
    e.textContent = L.en;
    b.appendChild(e);
  }
  b.addEventListener("click", () => { setLang(code); closePicker(); });
  return b;
}

function renderPicker() {
  document.getElementById("pickerTitle").textContent = t("language");
  document.getElementById("pickerClose").setAttribute("aria-label", t("close"));
  const q = document.getElementById("langSearch");
  q.placeholder = t("searchLang");
  const term = norm(q.value);
  const box = document.getElementById("langList");
  box.innerHTML = "";
  const heading = text => { const h = document.createElement("div"); h.className = "lang-head"; h.textContent = text; box.appendChild(h); };
  if (!term) {
    const rec = [viewLang, ...recent.filter(c => c !== viewLang)].slice(0, 5);
    heading(t("recent"));
    rec.forEach(c => box.appendChild(langRow(c)));
    heading(t("allLangs"));
  }
  const matches = ALL_LANGS.filter(([code, en, native]) =>
    !term || norm(en).includes(term) || norm(native).includes(term) || code.toLowerCase() === term);
  matches.forEach(([code]) => box.appendChild(langRow(code)));
  if (!matches.length) {
    const p = document.createElement("p");
    p.className = "lang-none";
    p.textContent = t("noLang");
    box.appendChild(p);
  }
}

// ---------- Sharing ----------

async function share() {
  let url;
  if (listId) {
    url = location.origin + "/l/" + listId;
  } else {
    toast(t("sharing"));
    try {
      const data = await api("POST", null, { items });
      listId = data.id;
      pending = [];
      acceptServer(data);
      history.replaceState(null, "", "/l/" + listId);
      renderSync();
      url = location.origin + "/l/" + listId;
    } catch (e) {
      // No database connected yet: fall back to a link that carries the list inside it.
      url = location.origin + "/#list=" + encodeList(items);
    }
  }
  const title = t("title");
  if (navigator.share) {
    try { await navigator.share({ title, text: title, url }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try {
    await navigator.clipboard.writeText(url);
    toast(t("copied"));
  } catch (e) {
    window.prompt(title, url);
  }
}

// Long links from the earlier version still open.
function encodeList(list) {
  const compact = list.map(i => [i.text, i.lang, i.done ? 1 : 0, i.tr]);
  const bytes = new TextEncoder().encode(JSON.stringify(compact));
  let bin = "";
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function decodeList(code) {
  const b64 = code.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b64 + "===".slice((b64.length + 3) % 4));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  const compact = JSON.parse(new TextDecoder().decode(bytes));
  if (!Array.isArray(compact)) throw new Error("bad list");
  return compact.filter(r => Array.isArray(r) && r[0]).map(r => {
    const tr = {};
    if (r[3] && typeof r[3] === "object") {
      Object.keys(r[3]).forEach(l => { if (CODE_RE.test(l) && r[3][l]) tr[l] = String(r[3][l]); });
    } else {
      ["en", "ar", "si", "ta", "sw"].forEach((l, k) => { if (r[3 + k]) tr[l] = String(r[3 + k]); });
    }
    const lang = typeof r[1] === "string" && (CODE_RE.test(r[1]) || r[1] === "auto") ? r[1] : "auto";
    return { id: newId(), text: String(r[0]), lang, done: !!r[2], tr };
  });
}

function importFromHash() {
  const m = location.hash.match(/list=([A-Za-z0-9_-]+)/);
  if (!m) return;
  let incoming;
  try { incoming = decodeList(m[1]); } catch (e) { incoming = null; }
  history.replaceState(null, "", location.pathname);
  if (!incoming) return;
  if (items.length && !confirm(t("importQ"))) return;
  listId = null;
  base = incoming;
  pending = [];
  recompute();
  saveLocal();
  render();
  toast(t("imported"));
  translateAllMissing();
}

// ---------- Display ----------

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function render() {
  const rtl = RTL.has(viewLang);
  document.documentElement.lang = viewLang;
  document.documentElement.dir = rtl ? "rtl" : "ltr";
  document.title = t("title");
  document.getElementById("title").textContent = t("title");
  document.getElementById("shareBtn").textContent = t("share");
  document.getElementById("addBtn").textContent = t("add");
  document.getElementById("itemInput").placeholder = t("placeholder");
  document.getElementById("tip").textContent = t("tip");
  document.getElementById("clearBtn").textContent = t("clear");
  document.getElementById("empty").textContent = t("empty");
  document.getElementById("newBtn").textContent = t("newList");
  document.getElementById("newBtn").style.display = (listId || items.length) ? "block" : "none";

  const L = LANG_BY_CODE.get(viewLang);
  document.getElementById("langName").textContent = L.native;
  document.getElementById("langBtn").setAttribute("aria-label", t("language") + ": " + L.native + " (" + L.en + ")");
  if (!document.getElementById("picker").hidden) renderPicker();

  renderSync();
  const list = document.getElementById("list");
  list.innerHTML = "";
  const done = items.filter(i => i.done).length;
  document.getElementById("empty").style.display = items.length ? "none" : "block";
  list.style.display = items.length ? "block" : "none";
  document.getElementById("bar").style.display = items.length ? "flex" : "none";
  document.getElementById("clearBtn").style.visibility = done ? "visible" : "hidden";
  document.getElementById("count").textContent = t("count", { d: done, n: items.length });

  // Still-to-buy first, bought items sink to the bottom.
  const ordered = items.filter(i => !i.done).concat(items.filter(i => i.done));
  for (const item of ordered) {
    const li = document.createElement("li");
    if (item.done) li.className = "done";

    const check = document.createElement("button");
    check.className = "check";
    check.setAttribute("role", "checkbox");
    check.setAttribute("aria-checked", String(item.done));
    check.innerHTML = CHECK_SVG;
    check.addEventListener("click", () => toggle(item.id));

    const text = document.createElement("div");
    text.className = "text";
    text.addEventListener("click", () => toggle(item.id));
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = item.tr[viewLang] || item.text;
    text.appendChild(name);
    check.setAttribute("aria-label", name.textContent);

    const key = item.id + "|" + viewLang;
    if (inFlight.has(key) && !item.tr[viewLang]) {
      const note = document.createElement("div");
      note.className = "orig";
      note.textContent = t("translating");
      text.appendChild(note);
    } else if (!item.tr[viewLang] && failedTr.has(key)) {
      const retry = document.createElement("button");
      retry.className = "retry";
      retry.textContent = "↻ " + t("retry");
      retry.addEventListener("click", e => { e.stopPropagation(); translateItem(item.id, viewLang); });
      text.appendChild(retry);
    } else if (norm(name.textContent) !== norm(item.text)) {
      // Show what was originally typed, so both people can double-check the translation.
      const orig = document.createElement("div");
      orig.className = "orig";
      orig.textContent = item.text;
      text.appendChild(orig);
    }

    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.setAttribute("aria-label", t("remove"));
    del.addEventListener("click", () => removeItem(item.id));

    li.append(check, text, del);
    list.appendChild(li);
  }
}

function renderSync() {
  const el = document.getElementById("sync");
  if (!listId) { el.hidden = true; return; }
  el.hidden = false;
  el.className = "sync" + (online ? "" : " off");
  el.textContent = online ? t("live") : t("offlineSync");
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

// ---------- Start ----------

loadLocal();
openListFromPath();
render();
importFromHash();
translateAllMissing();
if (listId) { flush(); refresh(); }

document.getElementById("addBtn").addEventListener("click", addFromInput);
document.getElementById("itemInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addFromInput(); } });
document.getElementById("clearBtn").addEventListener("click", removeBought);
document.getElementById("shareBtn").addEventListener("click", share);
document.getElementById("newBtn").addEventListener("click", startNewList);
document.getElementById("langBtn").addEventListener("click", openPicker);
document.getElementById("pickerClose").addEventListener("click", closePicker);
document.getElementById("picker").addEventListener("click", e => { if (e.target.id === "picker") closePicker(); });
document.getElementById("langSearch").addEventListener("input", renderPicker);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.getElementById("picker").hidden) closePicker(); });
ensureUi(viewLang);
window.addEventListener("hashchange", importFromHash);
window.addEventListener("online", () => { failedTr.clear(); ensureUi(viewLang); translateAllMissing(); flush(); refresh(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
setInterval(refresh, 4000);   // check for the other person's changes every few seconds

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}

</script>
</body>
